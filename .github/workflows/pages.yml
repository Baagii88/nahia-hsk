name: Publish Nahia
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: python audit-vocabulary.py
      - run: npm run bundle
      - name: Build learning app
        run: python build.py
      - name: Check application JavaScript
        run: |
          node --check app.js
          node --check sw.js
          node --check studio.js
          node --check school.js
          node --check library.js
          node --check courses.js
          node --check dictionary.js
          node --check learn.js
          node --check translations.js
          node --check pdf-books.js
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
